<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glass study — an author-modified product shot (CodeScene entry)</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
    <!--
      The reusable Look module imports the BARE specifier `three`; this inline import map
      resolves it to the pinned, sha256-verified vendored build beside this page. The study
      module (`./glass-study.mjs`) imports the vendored `./glass-product.mjs` as a sibling.
      No network, no CDN, no dev `references/` path: only files frozen into the capture
      snapshot.
    -->
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module">
      // Entry contract: `window.viscraft.render(ctx)` is called once per frame in
      // ascending frame order. The study builds the Look on the first frame (its product
      // geometry/material variant must be applied before the module builds its meshes), so
      // `ready()` has nothing to do and `render` is awaited.
      import { createStudyLook } from './glass-study.mjs';

      const canvas = document.getElementById('stage');
      let look = null;

      window.viscraft = {
        async ready() {
          /* the Look is built on the first frame, from that frame's params */
        },
        async render(ctx) {
          if (!look) look = await createStudyLook({ canvas });
          await look.render(ctx);
        },
        dispose() {
          look?.dispose();
        },
      };
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Poster-and-film — CodeScene entry</title>
<style>
  @font-face {
    font-family: "Archive CJK";
    src: url("fonts/NotoSansSC-400-subset.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Archive CJK";
    src: url("fonts/NotoSansSC-700-subset.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Archive Latin";
    src: url("fonts/SpaceGrotesk-400-subset.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Archive Latin";
    src: url("fonts/SpaceGrotesk-700-subset.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14110f; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<script type="module">
  // Entry contract: `ready` resolves when fonts and the photograph are usable,
  // and `render(ctx)` is called once per frame in ascending order.
  import { prepare, renderFilm } from './film.mjs';

  const canvas = document.getElementById('film');
  window.viscraft = {
    ready: () => prepare(import.meta.url),
    render(ctx) {
      canvas.width = ctx.width;
      canvas.height = ctx.height;
      renderFilm(canvas, ctx);
    },
  };
</script>
</body>
</html>

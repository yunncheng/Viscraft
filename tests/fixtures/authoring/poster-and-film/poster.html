<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>光的量度 — exhibition poster</title>
<link rel="stylesheet" href="poster.css">
</head>
<body>
<main class="poster">
  <header class="masthead">
    <div class="mast-left">
      <span class="mast-cjk">视觉档案</span>
      <span class="mast-latin">VISUAL ARCHIVE</span>
    </div>
    <div class="mast-right">
      <span class="mast-latin">NO. 01 / 2026</span>
      <span class="mast-cjk mast-dim">城市场域光档案</span>
    </div>
  </header>

  <div class="rule rule-top"></div>

  <figure class="plate">
    <img class="plate-image" src="assets/light.png" alt="A shaft of light crossing a plaster wall">
    <div class="scrim"></div>
    <figcaption class="plate-caption">图 01 · 西窗，下午四点</figcaption>
  </figure>

  <h1 class="headline" id="headline">光的量度</h1>
  <p class="headline-en" id="headline-en">MEASURING LIGHT</p>

  <section class="lede">
    <p>一次关于日常光线的观察与测量。我们把清晨、正午与黄昏的亮度并置，让那些被忽略的明暗关系重新可见。</p>
  </section>

  <aside class="facts">
    <div class="fact">
      <span class="fact-label">展期</span>
      <span class="fact-value">10.12 — 11.30</span>
    </div>
    <div class="fact">
      <span class="fact-label">地点</span>
      <span class="fact-value">城市场域光档案 · 三层</span>
    </div>
    <div class="fact">
      <span class="fact-label">时间</span>
      <span class="fact-value">每日 10:00 — 18:00</span>
    </div>
  </aside>

  <div class="index" aria-hidden="true">01</div>

  <footer class="colophon">
    <div class="rule rule-foot"></div>
    <div class="colophon-row">
      <span class="mast-cjk">城市光档案 · 2026 秋季展</span>
      <span class="mast-latin">VISCRAFT / EDITION 01</span>
    </div>
  </footer>
</main>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>contact-study — the operation, as a CodeScene entry</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14110c;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="study"></canvas>
    <script type="module">
      // Entry contract: window.viscraft.render(ctx) is called once per frame.
      // The composition (subject, material, camera) lives in ./contact-scene.mjs;
      // this page only wires the canvas to the contract.
      import { renderContact } from './contact-scene.mjs';
      window.viscraft = {
        render(ctx) {
          renderContact(document.getElementById('study'), ctx);
        },
      };
    </script>
  </body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cel figure — cel-layered CodeScene entry</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head><body>
<canvas id="cel"></canvas>
<script type="module">
// Entry contract: window.viscraft.render(ctx) is called once per frame.
// All Look/pose/lighting logic lives in ./cel.mjs so the module is reusable.
import { renderCel } from './cel.mjs';
window.viscraft = { render(ctx) { renderCel(document.getElementById('cel'), ctx); } };
</script>
</body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viscraft · measured-onset audio-visual</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060f;
        overflow: hidden;
      }
      /* The capture viewport is exactly the output size; the canvas fills it so the
     screenshot is the rendered frame, not a page around it. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1280" height="720"></canvas>
    <script>
      /*
       * Viscraft CodeScene: a frame-deterministic visualizer for host-selected,
       * measured audio onsets.
       *
       * Offline capture contract (see src/backends/browser/capture.ts):
       *   window.viscraft = { render: (ctx) => void, dispose?: () => void }
       *
       * render(ctx) receives { frame, time, fps, width, height, seed, params, bindings }.
       * This page draws from `params`; its Source also binds the frozen report for
       * evidence identity and simulated provenance. It loads no images:
       *   {
       *     frames, globalStartFrame, inFrame, sourceHash,
       *     events: [{ frame, sample, strength }],   // frame is shot-local, sample is absolute
       *     palette: { background, foreground, accent },
       *     mode: 'ripples' | 'spokes' | 'tiles'
       *   }
       *
       * Every drawn value is a pure function of (ctx.frame, ctx.params). There is no
       * wall clock, no Math.random, no requestAnimationFrame, no image decoding and
       * no WebAudio: the page never plays sound and never pretends to. The visual is
       * driven by the caller's measured events, and the calm base composition still
       * reads before the first onset.
       */
      (function () {
        'use strict';

        var canvas = document.getElementById('stage');
        var ctx = canvas.getContext('2d', { alpha: false });

        var TAU = Math.PI * 2;
        // Frames a pulse takes to fall from full strength to nothing.
        var DECAY = 8;

        function clamp(v, a, b) {
          return v < a ? a : v > b ? b : v;
        }
        function easeOutCubic(t) {
          t = clamp(t, 0, 1);
          return 1 - Math.pow(1 - t, 3);
        }

        function hexToRgb(hex) {
          var h = String(hex).replace('#', '');
          if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
          var n = parseInt(h, 16);
          if (!isFinite(n)) n = 0;
          return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }
        function rgba(c, a) {
          return 'rgba(' + (c.r | 0) + ',' + (c.g | 0) + ',' + (c.b | 0) + ',' + a + ')';
        }
        function mix(a, b, t) {
          return { r: a.r + (b.r - a.r) * t, g: a.g + (b.g - a.g) * t, b: a.b + (b.b - a.b) * t };
        }

        // Deterministic FNV-1a unit value: the same (sourceHash, index) always yields
        // the same layout. Pixel reproducibility remains limited to the verified
        // browser/font/environment. This is a hash, not a random source.
        function hashUnit(seed, index) {
          var s = String(seed) + ':' + index;
          var h = 2166136261 >>> 0;
          for (var i = 0; i < s.length; i++) {
            h ^= s.charCodeAt(i);
            h = Math.imul(h, 16777619) >>> 0;
          }
          return (h >>> 8) / 16777216;
        }

        function parsePalette(raw) {
          var defaults = { background: '#05060f', foreground: '#e8f0ff', accent: '#00e5ff' };
          raw = raw || {};
          function pick(key) {
            return typeof raw[key] === 'string' && /^#[0-9a-fA-F]{6}$/.test(raw[key]) ? raw[key] : defaults[key];
          }
          return {
            background: hexToRgb(pick('background')),
            foreground: hexToRgb(pick('foreground')),
            accent: hexToRgb(pick('accent')),
          };
        }

        // Keep only well-formed events, order them by frame, and normalize strength
        // against the loudest event in this shot so the envelope is always [0,1].
        function normalizeEvents(raw) {
          var events = [];
          if (Array.isArray(raw)) {
            for (var i = 0; i < raw.length; i++) {
              var e = raw[i] || {};
              if (!Number.isInteger(e.frame) || e.frame < 0 || !Number.isFinite(e.strength) || e.strength <= 0) continue;
              events.push({
                frame: e.frame,
                sample: Number.isFinite(e.sample) ? e.sample : 0,
                strength: e.strength,
              });
            }
          }
          events.sort(function (a, b) {
            return a.frame - b.frame;
          });
          var peak = 0;
          for (var j = 0; j < events.length; j++) if (events[j].strength > peak) peak = events[j].strength;
          for (var k = 0; k < events.length; k++) events[k].norm = events[k].strength / peak;
          return events;
        }

        // Decayed pulse at this integer frame: full at the exact event frame, linear
        // to zero over DECAY frames. Returns the most recent contributing event too.
        function pulseAt(events, frame) {
          var value = 0,
            exact = false,
            source = null;
          for (var i = 0; i < events.length; i++) {
            var event = events[i];
            if (event.frame > frame) break; // sorted ascending: nothing later can contribute
            var age = frame - event.frame;
            if (age > DECAY) continue;
            var decay = 1 - age / DECAY;
            var level = decay * decay * event.norm;
            if (level > value) {
              value = level;
              source = event;
            }
            if (age === 0) exact = true;
          }
          return { value: value, exact: exact, source: source };
        }

        function fillBackground(pal, width, height) {
          var g = ctx.createLinearGradient(0, 0, 0, height);
          g.addColorStop(0, rgba(mix(pal.background, pal.foreground, 0.05), 1));
          g.addColorStop(1, rgba(pal.background, 1));
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, width, height);
        }

        function drawCenterMarker(width, height, pal, pulse) {
          var cx = width / 2,
            cy = height / 2;
          var base = Math.min(width, height) * 0.028;
          var radius = base * (1 + 3.2 * pulse.value);
          var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2.4);
          glow.addColorStop(0, rgba(pal.accent, 0.2 + 0.7 * pulse.value));
          glow.addColorStop(1, rgba(pal.accent, 0));
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(cx, cy, radius * 2.4, 0, TAU);
          ctx.fill();
          ctx.fillStyle = rgba(mix(pal.foreground, pal.accent, 0.6), 0.55 + 0.45 * pulse.value);
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, TAU);
          ctx.fill();
          if (pulse.exact) {
            ctx.strokeStyle = rgba(pal.foreground, 0.95);
            ctx.lineWidth = Math.max(1.5, Math.min(width, height) * 0.004);
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 1.9, 0, TAU);
            ctx.stroke();
          }
        }

        function drawRipples(state, pal, pulse) {
          var W = state.width,
            H = state.height,
            cx = W / 2,
            cy = H / 2;
          var maxR = Math.sqrt(W * W + H * H) * 0.5;
          // Calm base: faint, static concentric rings that read with no onsets.
          ctx.lineWidth = Math.max(1, H * 0.0022);
          for (var i = 0; i < 7; i++) {
            var r = maxR * ((i + 1) / 8);
            ctx.strokeStyle = rgba(mix(pal.background, pal.foreground, 0.06 + 0.02 * i), 0.5);
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, TAU);
            ctx.stroke();
          }
          // Pulse: a ring expanding from the most recent event's age.
          if (pulse.source) {
            var radius = easeOutCubic(clamp((state.frame - pulse.source.frame) / DECAY, 0, 1)) * maxR;
            ctx.lineWidth = Math.max(1.5, H * 0.004) * (1 + 2.5 * pulse.value);
            ctx.strokeStyle = rgba(mix(pal.foreground, pal.accent, 0.5), 0.14 + 0.86 * pulse.value);
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, TAU);
            ctx.stroke();
          }
          drawCenterMarker(W, H, pal, pulse);
        }

        function drawSpokes(state, pal, pulse) {
          var W = state.width,
            H = state.height,
            cx = W / 2,
            cy = H / 2;
          var maxR = Math.sqrt(W * W + H * H) * 0.5;
          var spokes = 48;
          var rot = (state.frame * 0.0035) % TAU; // slow deterministic drift
          for (var i = 0; i < spokes; i++) {
            var ang = (i / spokes) * TAU + rot;
            var wave = 0.5 + 0.5 * Math.sin(i * 1.7 + state.frame * 0.035);
            var inner = maxR * 0.16;
            var outer = maxR * (0.42 + 0.14 * wave);
            ctx.lineWidth = Math.max(1, H * 0.0018);
            ctx.strokeStyle = rgba(mix(pal.background, pal.foreground, 0.1 + 0.08 * wave), 0.55);
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner);
            ctx.lineTo(cx + Math.cos(ang) * outer, cy + Math.sin(ang) * outer);
            ctx.stroke();
            // Pulse: brighter, longer spokes that flare on each measured onset.
            ctx.lineWidth = Math.max(1, H * 0.0032) * (1 + 1.6 * pulse.value);
            ctx.strokeStyle = rgba(mix(pal.foreground, pal.accent, 0.45 + 0.3 * wave), 0.1 + 0.8 * pulse.value);
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ang) * outer, cy + Math.sin(ang) * outer);
            ctx.lineTo(
              cx + Math.cos(ang) * maxR * (0.72 + 0.2 * wave * pulse.value),
              cy + Math.sin(ang) * maxR * (0.72 + 0.2 * wave * pulse.value),
            );
            ctx.stroke();
          }
          drawCenterMarker(W, H, pal, pulse);
        }

        function drawTiles(state, pal, pulse, sourceHash) {
          var W = state.width,
            H = state.height;
          var cols = 16,
            rows = 9;
          var cellW = W / cols,
            cellH = H / rows;
          var gap = Math.min(cellW, cellH) * 0.14;
          var cx = W / 2,
            cy = H / 2;
          var maxDist = Math.sqrt(cx * cx + cy * cy);
          for (var row = 0; row < rows; row++) {
            for (var col = 0; col < cols; col++) {
              var index = row * cols + col;
              var unit = hashUnit(sourceHash, index);
              var x = col * cellW + gap / 2;
              var y = row * cellH + gap / 2;
              var w = cellW - gap;
              var h = cellH - gap;
              var tx = x + w / 2,
                ty = y + h / 2;
              var dist = Math.sqrt((tx - cx) * (tx - cx) + (ty - cy) * (ty - cy)) / maxDist;
              var near = 1 - dist;
              // Calm base: a fixed, hash-derived tile field.
              var base = 0.25 + 0.6 * unit;
              var baseAlpha = 0.12 + 0.2 * near;
              ctx.fillStyle = rgba(mix(pal.background, pal.foreground, base), baseAlpha);
              ctx.fillRect(x, y, w, h);
              // Pulse: tiles near the center light up with the envelope.
              var level = pulse.value * (0.35 + 0.65 * near) * (0.6 + 0.4 * unit);
              if (level > 0.01) {
                ctx.fillStyle = rgba(mix(pal.foreground, pal.accent, 0.4 + 0.4 * unit), clamp(0.1 + 0.9 * level, 0, 1));
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = rgba(pal.foreground, clamp(0.15 + 0.65 * level, 0, 1));
                ctx.lineWidth = Math.max(1, Math.min(w, h) * 0.05);
                ctx.strokeRect(x, y, w, h);
              }
            }
          }
          drawCenterMarker(W, H, pal, pulse);
        }

        function render(opts) {
          opts = opts || {};
          var width = Math.max(2, Math.round(opts.width || canvas.width));
          var height = Math.max(2, Math.round(opts.height || canvas.height));
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
          }
          var params = opts.params || {};
          var frame = Number.isInteger(opts.frame) ? opts.frame : 0;

          var pal = parsePalette(params.palette);
          var events = normalizeEvents(params.events);
          var sourceHash = typeof params.sourceHash === 'string' ? params.sourceHash : '';
          var mode = params.mode === 'spokes' ? 'spokes' : params.mode === 'tiles' ? 'tiles' : 'ripples';

          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
          fillBackground(pal, width, height);

          var state = { width: width, height: height, frame: frame };
          var pulse = pulseAt(events, frame);
          if (mode === 'spokes') drawSpokes(state, pal, pulse);
          else if (mode === 'tiles') drawTiles(state, pal, pulse, sourceHash);
          else drawRipples(state, pal, pulse);
        }

        function dispose() {
          /* no images or timers to release */
        }

        window.viscraft = { render: render, dispose: dispose };
      })();
    </script>
  </body>
</html>

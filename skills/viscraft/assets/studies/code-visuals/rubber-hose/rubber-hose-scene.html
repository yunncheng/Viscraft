<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rubber hose — a complete acting beat</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="rubber-hose"></canvas>
<script type="module">
// Entry contract: render(ctx) is called once per frame. The Runtime supplies the
// real capture size, frame index, fps, seed and Source params. All drawing lives
// in ./rubber-hose.mjs (and its two local modules) so the same scene is reusable
// from the author module without this page.
import { renderRubberHose } from './rubber-hose.mjs';

const canvas = document.getElementById('rubber-hose');
window.viscraft = {
  render(ctx) {
    renderRubberHose(canvas, ctx);
  },
};
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crayon picture-book page — wax, tooth and one wash</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f4efe3; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="crayon-book"></canvas>
<script type="module">
// Entry contract: window.viscraft.ready() resolves after the WebGL2 compositor
// exists; render(ctx) is called once per frame with the real capture size.
import { readyCrayonBook, renderCrayonBook } from './crayon-book.mjs';

const canvas = document.getElementById('crayon-book');
window.viscraft = {
  async ready() {
    await readyCrayonBook(canvas);
  },
  render(ctx) {
    renderCrayonBook(canvas, ctx);
  },
};
</script>
</body>
</html>

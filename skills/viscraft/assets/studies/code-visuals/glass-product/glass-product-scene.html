<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glass product — stylized dark-studio Look (CodeScene entry)</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
    <!--
      The Look module imports the BARE specifier `three`; this inline import map resolves
      it to the pinned, sha256-verified vendored build beside this page. The three addons
      under ./vendor/addons/ import `three` the same way and resolve their own relative
      imports (./Pass.js, ../shaders/CopyShader.js) inside the vendored closure. No network,
      no CDN, no dev `references/` path: only files frozen into the capture snapshot.
    -->
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module">
      // Entry contract: `window.viscraft.render(ctx)` is called once per frame, in
      // ascending frame order, with no wall clock and no unseeded randomness. All Look
      // logic lives in ./glass-product.mjs so the module is reusable.
      import { createLook } from './glass-product.mjs';

      const canvas = document.getElementById('stage');
      let look = null;

      window.viscraft = {
        // Build the renderer/scene/composer once, before the first frame. Awaited by the
        // capture runner, so frame 0 waits for the engine and vendored addons to load.
        async ready() {
          look = await createLook({ canvas });
        },
        render(ctx) {
          if (!look) throw new Error('glass-product scene: ready() did not complete');
          look.render(ctx);
        },
      };
    </script>
  </body>
</html>

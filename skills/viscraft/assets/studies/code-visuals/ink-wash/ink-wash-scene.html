<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink wash — rice-paper study entry</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f2ecde; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="ink"></canvas>
<script type="module">
// Entry contract: window.viscraft.render(ctx) is called once per frame. The
// brush engine, figure, scenery and WebGL2 compositor live in ./ink-wash.mjs.
import { renderInk } from './ink-wash.mjs';

window.viscraft = {
  render(ctx) {
    renderInk(document.getElementById('ink'), ctx);
  },
};
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel art — night shrine entry</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="pixel-art"></canvas>
<script type="module">
// Entry contract: window.viscraft.render(ctx) is called once per frame.
// The 320x180 indexed framebuffer, rig, font and authored clock live in
// ./pixel-art-scene.mjs; this page only forwards the capture context.
import { renderPixelArt } from './pixel-art-scene.mjs';

window.viscraft = {
  render(ctx) {
    renderPixelArt(document.getElementById('pixel-art'), ctx);
  },
};
</script>
</body>
</html>
